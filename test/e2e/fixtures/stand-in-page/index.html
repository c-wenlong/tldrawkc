<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tldrawkc stand-in page</title>
  </head>
  <body>
    <div id="root">stand-in bridge</div>
    <!--
      A page that answers the bridge contract without tldraw.

      It exists so the Node half of the tool is testable on its own: exit
      codes, atomic saves, rollback, the temp-file screenshot path and the
      capability check are all decisions Node makes, and none of them should
      need a two megabyte editor bundle to prove. The real page is checked by
      the CLI suite next door, against what it actually drew.

      It is deliberately not a tldraw emulator. Shapes are objects in an array,
      `connect` records a binding, and the only lint rule is the one the real
      page also has to have: an arrow with a free end.
    -->
    <script src="./stand-in.js"></script>
  </body>
</html>
